<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primedic myAED Platform — Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--bg:#0A1018;--card:rgba(255,255,255,0.02);--border:rgba(255,255,255,0.05);--text:#C8D3DE;--text2:#5A6B7D;--text3:#4A5C6E;--accent:#00B0FF;--green:#00E676;--yellow:#FFD600;--red:#FF5252;--purple:#7C4DFF;--mono:'JetBrains Mono',monospace;--sans:'IBM Plex Sans Thai','IBM Plex Sans',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.1) transparent}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;font-size:13px}
.header{background:rgba(10,16,24,0.97);border-bottom:1px solid rgba(255,255,255,0.04);padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.header-left{display:flex;align-items:center;gap:12px}
.header-logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#0091EA);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;font-family:var(--mono);box-shadow:0 0 20px rgba(0,176,255,0.25)}
.header-title{font-size:14px;font-weight:700;color:#E8ECF1;letter-spacing:-0.02em}
.header-sub{font-size:9.5px;color:var(--text3);font-weight:500;letter-spacing:0.06em;text-transform:uppercase}
.demo-badge{background:rgba(255,214,0,0.08);border:1px solid rgba(255,214,0,0.2);border-radius:7px;padding:4px 10px;font-size:10px;color:var(--yellow);font-weight:600;display:flex;align-items:center;gap:5px}
.demo-dot{width:5px;height:5px;border-radius:50%;background:var(--yellow);animation:blink 2s infinite}
.layout{display:flex;min-height:calc(100vh - 56px)}
.sidebar{width:180px;background:rgba(255,255,255,0.012);border-right:1px solid rgba(255,255,255,0.04);padding:16px 8px;flex-shrink:0;display:flex;flex-direction:column}
.nav-btn{width:100%;display:flex;align-items:center;gap:9px;padding:9px 12px;margin-bottom:2px;border:none;border-radius:9px;cursor:pointer;font-size:12px;font-weight:400;font-family:inherit;transition:all 0.15s;background:transparent;color:var(--text2);border-left:3px solid transparent}
.nav-btn.active{font-weight:600;background:rgba(0,176,255,0.1);color:var(--accent);border-left-color:var(--accent)}
.nav-btn:hover:not(.active){background:rgba(255,255,255,0.03)}
.nav-icon{font-size:14px;width:20px;text-align:center}
.sidebar-info{margin:0 10px;padding:10px 12px;background:rgba(255,255,255,0.015);border-radius:8px;border:1px solid rgba(255,255,255,0.03);font-size:10px;color:var(--text3)}
.sidebar-info-title{font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:0.06em}
.main{flex:1;padding:20px 24px;overflow-y:auto;overflow-x:hidden}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{position:relative;overflow:hidden}
.stat-card .bg-icon{position:absolute;top:-15px;right:-5px;font-size:50px;opacity:0.04}
.stat-label{font-size:10px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.stat-value{font-size:28px;font-weight:700;font-family:var(--mono);letter-spacing:-0.04em}
.section-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-title h3{font-size:15px;font-weight:700;color:#E0E6ED;display:flex;align-items:center;gap:8px}
.badge{padding:2px 10px;border-radius:20px;font-size:10px;font-weight:600;display:inline-block}
.badge-online{background:rgba(0,230,118,0.08);color:var(--green);border:1px solid rgba(0,230,118,0.13)}
.badge-warning{background:rgba(255,214,0,0.08);color:var(--yellow);border:1px solid rgba(255,214,0,0.13)}
.badge-offline{background:rgba(255,82,82,0.08);color:var(--red);border:1px solid rgba(255,82,82,0.13)}
.badge-critical{background:rgba(255,82,82,0.08);color:var(--red);border:1px solid rgba(255,82,82,0.13)}
.badge-pending{background:rgba(124,77,255,0.08);color:var(--purple);border:1px solid rgba(124,77,255,0.13)}
.badge-active{background:rgba(0,230,118,0.08);color:var(--green);border:1px solid rgba(0,230,118,0.13)}
.badge-ok{background:rgba(0,230,118,0.08);color:var(--green);border:1px solid rgba(0,230,118,0.13)}
.badge-info{background:rgba(0,176,255,0.08);color:var(--accent);border:1px solid rgba(0,176,255,0.13)}
.btn{border:none;border-radius:8px;padding:8px 16px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:all 0.2s}
.btn-filled{background:linear-gradient(135deg,var(--accent),rgba(0,176,255,0.8));color:#fff;box-shadow:0 2px 12px rgba(0,176,255,0.3)}
.btn-outline{background:rgba(0,176,255,0.06);border:1px solid rgba(0,176,255,0.2);color:var(--accent)}
.btn-red{background:linear-gradient(135deg,#E74C3C,rgba(231,76,60,0.8));color:#fff;box-shadow:0 2px 12px rgba(231,76,60,0.3)}
.btn-sm{padding:3px 10px;font-size:10px}
.btn-full{width:100%;justify-content:center}
.battery{display:flex;align-items:center;gap:5px;font-size:11px}
.battery-shell{width:24px;height:11px;border-radius:2px;position:relative;display:flex;align-items:center;padding:1px}
.battery-tip{position:absolute;right:-4px;top:2.5px;width:2.5px;height:5px;border-radius:0 1.5px 1.5px 0}
.battery-fill{height:100%;border-radius:1px}
.battery-text{font-weight:600;font-family:var(--mono)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.device-row{display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:3px;border-radius:7px;cursor:pointer;transition:background 0.15s}
.device-row:hover{background:rgba(0,176,255,0.04)}
.dot{width:7px;height:7px;border-radius:50%}
.dot-lg{width:8px;height:8px;border-radius:50%}
.alert-row{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:11px}
.tab-content{display:none}.tab-content.active{display:block}
/* Map */
.map-layout{display:grid;grid-template-columns:1fr 280px;gap:12px;height:calc(100vh - 160px)}
.map-container{padding:0;overflow:hidden}
.map-list{overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.map-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;cursor:pointer;transition:all 0.15s}
.map-item.selected{background:rgba(0,176,255,0.08);border-color:rgba(0,176,255,0.3)}
.map-item-detail{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);font-size:10px;color:#6B7B8D;display:grid;gap:3px}
.leaflet-container{background:var(--bg)!important}
/* Monitor */
.alert-card{display:flex;align-items:center;gap:10px;padding:8px 12px;margin-bottom:4px;border-radius:8px}
.monitor-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.monitor-device{border-radius:14px}
.sparkline-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sparkline-label{font-size:9px;color:var(--text3);margin-bottom:2px}
/* Decoder */
.dec-steps{display:flex;justify-content:center;gap:24px;margin-bottom:20px}
.dec-step{display:flex;align-items:center;gap:6px}
.dec-step-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:rgba(255,255,255,0.1)}
.dec-step-dot.active{background:linear-gradient(135deg,#3498DB,#2980B9)}
.dec-step-dot.done{background:#27AE60}
.dropzone{border:2px dashed rgba(52,152,219,0.25);border-radius:14px;padding:40px 24px;text-align:center;cursor:pointer;background:rgba(52,152,219,0.03);margin-bottom:16px;transition:all 0.2s}
.dropzone:hover{border-color:rgba(52,152,219,0.5)}
.file-item{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;margin-bottom:6px;overflow:hidden}
.file-header{display:flex;align-items:center;padding:8px 12px;gap:8px}
.file-icon{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:14px}
.hex-dump{background:rgba(0,0,0,0.25);padding:8px 12px;font-family:var(--mono);font-size:9.5px;line-height:1.5;color:#7DCEA0;overflow-x:auto;white-space:pre;max-height:160px;overflow-y:auto;border-top:1px solid rgba(255,255,255,0.04)}
/* Device list */
.device-card{border-radius:11px;padding:14px 18px;margin-bottom:8px;cursor:pointer;transition:all 0.15s}
.device-card:hover{background:rgba(0,176,255,0.03)}
.device-card.selected{background:rgba(0,176,255,0.05);border-color:rgba(0,176,255,0.2)}
.device-detail{margin-top:12px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.05);display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px 16px;font-size:11px}
/* Customer */
.cust-card{margin-bottom:8px}
.cust-header{display:flex;align-items:center;gap:12px}
.cust-avatar{width:38px;height:38px;border-radius:9px;background:rgba(124,77,255,0.08);border:1px solid rgba(124,77,255,0.2);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:var(--purple)}
.cust-actions{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.cust-tag{font-size:10px;color:var(--text2);font-family:var(--mono);background:rgba(255,255,255,0.03);padding:2px 7px;border-radius:4px}
/* API */
.api-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.api-btn{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;text-align:left;transition:all 0.15s;font-family:inherit}
.api-btn:hover{border-color:rgba(0,176,255,0.3);background:rgba(0,176,255,0.05)}
.api-panel{overflow:hidden;padding:0}
.api-panel-header{padding:10px 16px;border-bottom:1px solid rgba(255,255,255,0.04);display:flex;align-items:center;gap:8px}
.api-panel-body{display:grid;grid-template-columns:1fr 1fr}
.api-panel-side{padding:14px}
.api-panel-side:first-child{border-right:1px solid rgba(255,255,255,0.04)}
.api-label{font-size:9px;color:var(--text3);font-weight:700;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.api-code{margin:0;font-size:10px;line-height:1.5;font-family:var(--mono);white-space:pre-wrap}
.api-log{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:11px}
.api-method{background:rgba(0,176,255,0.1);color:var(--accent);padding:1px 7px;border-radius:3px;font-size:9px;font-weight:600;font-family:var(--mono)}
/* Modal */
.modal-overlay{position:fixed;inset:0;z-index:1000;display:none;align-items:center;justify-content:center}
.modal-overlay.open{display:flex}
.modal-bg{position:absolute;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px)}
.modal{position:relative;background:#111921;border:1px solid rgba(255,255,255,0.08);border-radius:16px;width:92%;max-width:560px;max-height:88vh;overflow:auto;padding:24px 28px}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.modal-header h3{margin:0;font-size:16px;font-weight:700;color:#E0E6ED}
.modal-close{background:rgba(255,255,255,0.06);border:none;border-radius:8px;color:#8899AA;width:30px;height:30px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center}
.field{margin-bottom:12px}
.field label{display:block;font-size:10px;color:#6B7B8D;margin-bottom:3px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em}
.field input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 11px;color:#E0E6ED;font-size:12px;outline:none;font-family:inherit;transition:border-color 0.2s;box-sizing:border-box}
.field input:focus{border-color:rgba(0,176,255,0.5)}
.field input::placeholder{color:#3A4A5A}
.field .req{color:var(--red)}
/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);z-index:2000;background:#1A2636;border:1px solid rgba(0,230,118,0.3);border-radius:10px;padding:10px 20px;font-size:13px;color:#B0F0C8;box-shadow:0 8px 32px rgba(0,0,0,0.5);opacity:0;transition:all .3s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* Spinner */
.spinner{position:relative;width:70px;height:70px;margin:0 auto 20px}
.spinner-outer{position:absolute;inset:0;border:3px solid rgba(52,152,219,0.2);border-top-color:#3498DB;border-radius:50%;animation:spin 1s linear infinite}
.spinner-inner{position:absolute;inset:8px;border:3px solid rgba(231,76,60,0.2);border-bottom-color:#E74C3C;border-radius:50%;animation:spin 1.5s linear infinite reverse}
.spinner-icon{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:24px}
.dots{display:flex;gap:4px;justify-content:center;margin-top:16px}
.dots span{width:7px;height:7px;border-radius:50%;background:#3498DB;animation:pulse 1.4s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.dots span:nth-child(4){animation-delay:.6s}.dots span:nth-child(5){animation-delay:.8s}
.back-link{text-decoration:none;color:var(--accent);font-size:11px;padding:4px 10px;border-radius:6px;border:1px solid rgba(0,176,255,0.2);background:rgba(0,176,255,0.06);display:inline-flex;align-items:center;gap:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%,80%,100%{transform:scale(.6);opacity:.3}40%{transform:scale(1);opacity:1}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
@media(max-width:800px){.sidebar{display:none}.stats-grid{grid-template-columns:repeat(2,1fr)}.grid-2,.map-layout,.monitor-grid,.api-grid,.api-panel-body{grid-template-columns:1fr}.device-detail{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Header -->
<header class="header">
  <div class="header-left">
    <div class="header-logo">P</div>
    <div>
      <div class="header-title">Primedic myAED Platform</div>
      <div class="header-sub">IOT Control · Map · Decoder · Monitor</div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <a href="/index.html" class="back-link">← AED Decoder</a>
    <div class="demo-badge"><span class="demo-dot"></span>DEMO</div>
  </div>
</header>

<div class="layout">
  <!-- Sidebar -->
  <nav class="sidebar">
    <button class="nav-btn active" onclick="switchTab('overview')" id="nav-overview"><span class="nav-icon">◉</span>ภาพรวม</button>
    <button class="nav-btn" onclick="switchTab('map')" id="nav-map"><span class="nav-icon">⊕</span>แผนที่</button>
    <button class="nav-btn" onclick="switchTab('monitor')" id="nav-monitor"><span class="nav-icon">◈</span>Monitoring</button>
    <button class="nav-btn" onclick="switchTab('decoder')" id="nav-decoder"><span class="nav-icon">⚡</span>AED Decoder</button>
    <button class="nav-btn" onclick="switchTab('devices')" id="nav-devices"><span class="nav-icon">◇</span>เครื่อง AED</button>
    <button class="nav-btn" onclick="switchTab('customers')" id="nav-customers"><span class="nav-icon">◎</span>ลูกค้า</button>
    <button class="nav-btn" onclick="switchTab('api')" id="nav-api"><span class="nav-icon">⟐</span>API Console</button>
    <div style="flex:1"></div>
    <div class="sidebar-info">
      <div class="sidebar-info-title">API</div>
      appKey: <span style="color:var(--accent);font-family:var(--mono)">demo_***</span><br>
      Mode: <span style="color:var(--yellow)">Mock</span>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="main" id="mainContent"></main>
</div>

<!-- Modals -->
<div class="modal-overlay" id="modalAddCust">
  <div class="modal-bg" onclick="closeModal('modalAddCust')"></div>
  <div class="modal">
    <div class="modal-header"><h3>เพิ่มลูกค้า — /openapi/customer</h3><button class="modal-close" onclick="closeModal('modalAddCust')">✕</button></div>
    <div style="font-size:10px;color:var(--text3);margin-bottom:12px;font-family:var(--mono);background:rgba(0,176,255,0.04);padding:5px 9px;border-radius:5px">POST · optType: "C"</div>
    <div class="field"><label>ชื่อลูกค้า <span class="req">*</span></label><input id="nc_name" placeholder="โรงพยาบาล..."></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="field"><label>ประเทศ</label><input id="nc_country" value="Thailand"></div>
      <div class="field"><label>จังหวัด</label><input id="nc_region" placeholder="Bangkok"></div>
    </div>
    <div class="field"><label>ผู้ติดต่อ</label><input id="nc_contact" placeholder="ชื่อ"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <div class="field"><label>โทร</label><input id="nc_phone" placeholder="+66..."></div>
      <div class="field"><label>Email</label><input id="nc_email" placeholder="email" type="email"></div>
    </div>
    <button class="btn btn-filled btn-full" style="padding:11px;margin-top:6px" onclick="mockApi('/openapi/customer','C');closeModal('modalAddCust')">ส่งคำสั่ง CREATE</button>
  </div>
</div>

<div class="modal-overlay" id="modalAddDev">
  <div class="modal-bg" onclick="closeModal('modalAddDev')"></div>
  <div class="modal">
    <div class="modal-header"><h3>ลงทะเบียนเครื่อง — /openapi/device-installation</h3><button class="modal-close" onclick="closeModal('modalAddDev')">✕</button></div>
    <div style="font-size:10px;color:var(--text3);margin-bottom:12px;font-family:var(--mono);background:rgba(0,176,255,0.04);padding:5px 9px;border-radius:5px">POST · optType: "C"</div>
    <div class="field"><label>Device S/N <span class="req">*</span></label><input id="nd_sn" placeholder="HS0Y..."></div>
    <div class="field"><label>รุ่น</label><input id="nd_model" value="HeartSave Y"></div>
    <div class="field"><label>Customer Code <span class="req">*</span></label><input id="nd_cust" placeholder="c011..."></div>
    <div class="field"><label>ตำแหน่ง</label><input id="nd_loc" placeholder="ล็อบบี้ชั้น 1"></div>
    <div class="field"><label>วันติดตั้ง</label><input id="nd_date" placeholder="YYYY-MM-DD"></div>
    <button class="btn btn-filled btn-full" style="padding:11px;margin-top:6px" onclick="mockApi('/openapi/device-installation','C');closeModal('modalAddDev')">ส่งคำสั่ง CREATE</button>
  </div>
</div>

<script>
// ─── DATA ─────────────────────────────────────────────
const CUSTOMERS=[
  {id:"c011",name:"โรงพยาบาลกรุงเทพ สำนักงานใหญ่",country:"Thailand",region:"Bangkok",province:"Bangkok",contact:"ดร.สมชาย วงศ์แพทย์",phone:"+66 2-310-3000",email:"somchai@bgh.co.th",devices:12,status:"active"},
  {id:"c012",name:"Central Festival Pattaya",country:"Thailand",region:"Chonburi",province:"Pattaya",contact:"คุณวิภา จันทร์ศรี",phone:"+66 38-003-999",email:"vipa@central.co.th",devices:4,status:"active"},
  {id:"c013",name:"มหาวิทยาลัยมหิดล",country:"Thailand",region:"Nakhon Pathom",province:"Salaya",contact:"ผศ.ดร.นภา อรุณเรือง",phone:"+66 2-441-0000",email:"napa@mahidol.ac.th",devices:8,status:"active"},
  {id:"c014",name:"Siam Paragon",country:"Thailand",region:"Bangkok",province:"Pathumwan",contact:"คุณพิชัย สยามรัตน์",phone:"+66 2-690-1000",email:"pichai@siampiwat.com",devices:6,status:"active"},
  {id:"c015",name:"Galeria Kaufhof Munich",country:"Germany",region:"Bavaria",province:"Munich",contact:"Lucas Weber",phone:"+49 188464895",email:"lucas@web.de",devices:3,status:"pending"}

function flash(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),3000);}
function mockApi(ep,opt){flash("✅ DEMO: POST "+ep+" — optType: \""+opt+"\" — สำเร็จ");}
function openModal(id){document.getElementById(id).classList.add("open");}
function closeModal(id){document.getElementById(id).classList.remove("open");}
function idFile(n){const l=n.toLowerCase();if(l==="user.json")return FILE_TYPES.user;if(l.includes("event"))return FILE_TYPES.event;if(l.includes("cpr"))return FILE_TYPES.cpr;if(l.includes("ecg"))return FILE_TYPES.ecg;if(l.includes("syslog"))return FILE_TYPES.syslog;return null;}
function fmtB(b){if(b<1024)return b+" B";if(b<1048576)return(b/1024).toFixed(1)+" KB";return(b/1048576).toFixed(2)+" MB";}
function toHex(buf,max){max=max||256;const by=new Uint8Array(buf).slice(0,max);let lines=[];for(let i=0;i<by.length;i+=16){const off=i.toString(16).padStart(8,"0");let hex=[],ascii="";for(let j=0;j<16;j++){if(i+j<by.length){hex.push(by[i+j].toString(16).padStart(2,"0"));ascii+=by[i+j]>=32&&by[i+j]<=126?String.fromCharCode(by[i+j]):".";}else{hex.push("  ");ascii+=" ";}}lines.push(off+"  "+hex.slice(0,8).join(" ")+"  "+hex.slice(8).join(" ")+"  |"+ascii+"|");}return lines.join("\n");}
function batteryHTML(level){const c=level>60?"#00E676":level>25?"#FFD600":"#FF5252";return '<div class="battery"><div class="battery-shell" style="border:1.5px solid '+c+'"><div class="battery-fill" style="width:'+level+'%;background:'+c+'"></div><div class="battery-tip" style="background:'+c+'"></div></div><span class="battery-text" style="color:'+c+'">'+level+'%</span></div>';}
function badgeHTML(status){const s=ST[status]||ST.info;return '<span class="badge badge-'+status+'">'+s.label+'</span>';}
function sparkSVG(data,color,w,h){if(!data||!data.length)return"";w=w||120;h=h||32;const max=Math.max(...data),min=Math.min(...data),range=max-min||1;const pts=data.map((v,i)=>(i/(data.length-1))*w+","+(h-((v-min)/range)*(h-4)-2)).join(" ");const lx=(data.length-1)/(data.length-1)*w,ly=h-((data[data.length-1]-min)/range)*(h-4)-2;return '<svg width="'+w+'" height="'+h+'" style="display:block"><polyline points="'+pts+'" fill="none" stroke="'+color+'" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+lx+'" cy="'+ly+'" r="2.5" fill="'+color+'"/></svg>';}

function initMap(){
  const el=document.getElementById("mapEl");
  if(!el)return;
  if(mapInstance){mapInstance.remove();mapInstance=null;markers=[];}
  mapInstance=L.map(el,{zoomControl:false}).setView([13.75,100.52],6);
  L.control.zoom({position:"bottomright"}).addTo(mapInstance);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19}).addTo(mapInstance);
  DEVICES.forEach(d=>{
    const s=ST[d.status];
    const icon=L.divIcon({className:"",html:'<div style="width:14px;height:14px;border-radius:50%;background:'+s.color+';border:2px solid #0A1018;box-shadow:0 0 10px '+s.color+'88;cursor:pointer"></div>',iconSize:[14,14],iconAnchor:[7,7]});
    const marker=L.marker([d.lat,d.lng],{icon}).addTo(mapInstance);
    marker.bindPopup('<div style="font-family:sans-serif;font-size:12px;min-width:160px"><b>'+d.sn+'</b><br/>'+d.model+'<br/>'+d.location+'<br/>🔋 '+d.battery+'% · <span style="color:'+s.color+'">'+s.label+'</span></div>');
    marker.on("click",()=>selectDevice(d.sn));
    markers.push(marker);
  });
  if(DEVICES.length>0){
    const bounds=L.latLngBounds(DEVICES.map(d=>[d.lat,d.lng]));
    mapInstance.fitBounds(bounds,{padding:[40,40],maxZoom:12});
  }
  if(selectedDevice){
    const d=DEVICES.find(x=>x.sn===selectedDevice);
    if(d)setTimeout(()=>mapInstance.flyTo([d.lat,d.lng],15,{duration:1}),500);
  }
}

function selectDevice(sn){
  selectedDevice=selectedDevice===sn?null:sn;
  if(currentTab==="map"){render();setTimeout(()=>{if(mapInstance&&selectedDevice){const d=DEVICES.find(x=>x.sn===selectedDevice);if(d)mapInstance.flyTo([d.lat,d.lng],15,{duration:1});}},200);}
  else if(currentTab==="devices")render();
}

      decFiles.forEach(f=>{

        h+='<div class="file-item"><div class="file-header"><div class="file-icon" style="background:'+(info?info.color:"#555")+'20">'+(info?info.icon:"📎")+'</div><div style="flex:1"><div style="font-weight:600;font-size:12px">'+f.name+'</div><div style="font-size:10px;color:var(--text2)">'+(info?info.label:"Unknown")+' — '+fmtB(f.size)+'</div></div><button class="btn btn-sm" style="background:rgba(255,255,255,0.06);color:#8899AA;border:none" onclick="toggleHex(\''+f.name+'\')">'+(exp?"ซ่อน":"HEX")+'</button><button class="btn btn-sm" style="background:rgba(255,82,82,0.12);color:var(--red);border:none;font-weight:700" onclick="removeDecFile(\''+f.name+'\')">×</button></div>';
        if(exp&&decHex[f.name])h+='<div class="hex-dump">'+decHex[f.name]+'</div>';
        h+='</div>';
      });
      h+='<button class="btn btn-red btn-full" style="padding:12px;margin-top:10px;font-size:14px;border-radius:10px" onclick="startDecode()">⚡ ถอดรหัสและสร้างรายงาน</button>';
    }
  }else if(decStep==="decoding"){
    h+='<div style="text-align:center;padding:50px 20px"><div class="spinner"><div class="spinner-outer"></div><div class="spinner-inner"></div><div class="spinner-icon">🔓</div></div><div style="font-size:15px;font-weight:600;margin-bottom:6px">กำลังถอดรหัส...</div><div style="font-size:12px;color:var(--text2)" id="decProgress"></div><div class="dots"><span></span><span></span><span></span><span></span><span></span></div></div>';
  }else if(decStep==="report"&&decReport){
    h+='<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap"><button class="btn btn-red" onclick="printReport()">🖨️ พิมพ์ / PDF</button><button class="btn btn-outline" onclick="downloadHTML()">📄 HTML</button><button class="btn btn-outline" style="color:var(--green);border-color:rgba(0,230,118,0.2)" onclick="downloadJSON()">📋 JSON</button></div>';
    h+='<div class="card" style="background:#fff;padding:0;overflow:hidden"><div id="reportContent">'+genReportHTML(decReport)+'</div></div>';
  }
  return h;
}

function handleDecDrop(e){e.preventDefault();handleDecFiles(e.dataTransfer.files);}
async function handleDecFiles(fileList){
  const arr=Array.from(fileList).filter(f=>idFile(f.name));
  if(!arr.length){flash("⚠️ ไม่พบไฟล์ที่รองรับ");return;}
  const names=decFiles.map(x=>x.name);
  decFiles=decFiles.concat(arr.filter(f=>!names.includes(f.name)));
  for(const f of arr){if(!names.includes(f.name)){const buf=await f.arrayBuffer();decHex[f.name]=toHex(buf);}}
  render();
}
function removeDecFile(name){decFiles=decFiles.filter(f=>f.name!==name);delete decHex[name];delete hexExpanded[name];render();}
function toggleHex(name){hexExpanded[name]=!hexExpanded[name];render();}
function resetDecoder(){decFiles=[];decHex={};decReport=null;decStep="upload";hexExpanded={};render();}

async function startDecode(){
  decStep="decoding";render();
  const sp=t=>{const el=document.getElementById("decProgress");if(el)el.textContent=t;};
  try{
    sp("กำลังเตรียมข้อมูลไฟล์...");
    const descs=[],parts=[];
    for(const f of decFiles){
      const info=idFile(f.name);
      descs.push("- "+f.name+" ("+fmtB(f.size)+") → "+(info?info.label:"Unknown"));
      if(f.name.toLowerCase().endsWith(".json")){
        const t=await f.text();
        parts.push({type:"text",text:"=== FILE: "+f.name+" (JSON) ===\n"+t+"\n=== END FILE ==="});
      }else{
        const buf=await f.arrayBuffer();
        parts.push({type:"text",text:"=== "+f.name+" ("+fmtB(f.size)+") ===\nHEX:\n"+toHex(buf,4096)+"\n=== END ==="});
      }
    }
    sp("กำลังส่งข้อมูลไปยัง AI เพื่อถอดรหัส...");
    const sysPrompt='You are an expert AED binary log decoder for Primedic/Yuwell devices. Decode the uploaded binary files and produce a COMPREHENSIVE Thai-language CPR report in structured JSON. For binary files, analyze hex data: event.bin (timestamps+event codes), cpr (depth/rate/release), ecg (16-bit signed LE waveform), syslog.bin (system log), user.json (device/patient info). Even if you cannot fully decode, provide BEST interpretation. Respond with ONLY JSON (no markdown): {"device":{"model":"","serial":"","firmware":"","manufacture_date":"","last_service":""},"patient":{"id":"","age":0,"gender":"","location":""},"operator":{"name":"","role":"","cert":""},"incident":{"date":"","time":"","response_time_sec":0,"ems_arrival_min":0},"events":[{"time":"","elapsed":"","code":"","description":"Thai"}],"cpr_rounds":[{"round":1,"start_sec":0,"duration_sec":120,"compressions":240,"avg_depth_mm":52.3,"avg_rate_bpm":110,"avg_release_pct":92,"depth_compliance":85,"rate_compliance":78,"release_compliance":90}],"shocks":[{"time":"","elapsed":"","energy_j":200,"current_a":8.5,"impedance_ohm":65,"result":"สำเร็จ"}],"ecg_analysis":{"initial_rhythm":"","final_rhythm":"","duration_sec":60,"interpretation":"Thai"},"device_checks":[{"item":"Thai","result":"ผ่าน/ไม่ผ่าน","detail":""}],"metrics":{"total_rounds":0,"total_compressions":0,"total_cpr_duration_sec":0,"overall_avg_depth":0,"overall_avg_rate":0,"overall_avg_release":0,"overall_depth_compliance":0,"overall_rate_compliance":0,"overall_release_compliance":0},"recommendations":["Thai"]} ALL descriptions/recommendations in Thai. Use AHA 2020: depth 50-60mm, rate 100-120/min, recoil >=80%.';
    const userContent=[{type:"text",text:"ถอดรหัส AED binary:\n"+descs.join("\n")+"\nวิเคราะห์ไฟล์ ส่ง JSON:"},...parts];
    const resp=await fetch("/api/decode",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:8000,system:sysPrompt,messages:[{role:"user",content:userContent}]})});
    if(!resp.ok)throw new Error("API Error "+resp.status);
    sp("กำลังวิเคราะห์ผลลัพธ์...");
    const data=await resp.json();
    const text=data.content.map(c=>c.type==="text"?c.text:"").join("");
    decReport=JSON.parse(text.replace(/```json\s*/g,"").replace(/```\s*/g,"").trim());
    decStep="report";render();
  }catch(err){flash("⚠️ "+err.message);decStep="upload";render();}
}

  h+='<div class="card" style="margin-top:10px"><div class="section-title"><h3><span style="color:var(--purple)">📋</span> Call History</h3></div>';
  API_LOGS.forEach((l,i)=>{
    h+='<div class="api-log" style="border-bottom:'+(i<API_LOGS.length-1?"1px solid rgba(255,255,255,0.03)":"none")+'"><span style="font-family:var(--mono);color:var(--text3);font-size:10px;width:60px">'+l.time+'</span><span class="api-method">'+l.method+'</span><span style="font-family:var(--mono);color:#7B8A9A;flex:1;font-size:10px">'+l.endpoint+'</span><span style="font-family:var(--mono);color:'+(l.status===200?"var(--green)":"var(--red)")+';font-weight:600;font-size:10px">'+l.status+'</span><span style="font-family:var(--mono);color:#3A4A5A;font-size:9px">'+l.duration+'</span></div>';
  });
  h+='</div>';
  h+='<div style="background:rgba(255,214,0,0.04);border:1px solid rgba(255,214,0,0.1);border-radius:10px;padding:12px 16px;margin-top:10px;font-size:11px;color:#A09050"><strong style="color:var(--yellow)">🔐 Auth:</strong> sign = MD5(appKey + timestamp + appSecret) 32 chars lowercase — ขอ credentials จาก Primedic</div>';
  return h;
}

// ─── LIVE DATA UPDATE ─────────────────────────────────
setInterval(()=>{
  DEVICES.forEach(d=>{
    if(d.status==="offline")return;
    const p=liveData[d.sn]||{battery:[],temp:[]};
    p.battery=[...p.battery.slice(-19),d.battery+Math.random()*4-2];
    p.temp=[...p.temp.slice(-19),(d.temp||24)+Math.random()*3-1.5];
    liveData[d.sn]=p;
  });
  if(currentTab==="monitor")render();
},3000);

// ─── INIT ─────────────────────────────────────────────
render();
</script>
